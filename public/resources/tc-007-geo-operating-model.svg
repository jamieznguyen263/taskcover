<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="geo-title geo-desc">
  <title id="geo-title">The six-layer GEO operating model</title>
  <desc id="geo-desc">Six layers in sequence: prompt demand, technical eligibility, answer-ready content, entity consistency, third-party authority, and measurement. Measurement feeds back into prompt demand as a repeating loop, and each layer has a 0 to 3 maturity score.</desc>
  <rect x="0" y="0" width="960" height="620" fill="#ffffff" />

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569" />
    </marker>
  </defs>

  <!-- six layer boxes, alternating left/right down the page, connected top to bottom -->
  <!-- 1 -->
  <rect x="60" y="20" width="380" height="80" rx="12" fill="#f4f8fb" stroke="#10e66a" stroke-width="2"/>
  <text x="80" y="48" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">1. Prompt demand</text>
  <text x="80" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Which real buyer questions matter, per market?</text>
  <text x="80" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Test: documented prompt universe exists</text>

  <!-- 2 -->
  <rect x="520" y="110" width="380" height="80" rx="12" fill="#f4f8fb" stroke="#12c679" stroke-width="2"/>
  <text x="540" y="138" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">2. Technical eligibility</text>
  <text x="540" y="158" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Can engines fetch, render, and read the page?</text>
  <text x="540" y="176" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Test: indexed, renderable, text available</text>

  <!-- 3 -->
  <rect x="60" y="200" width="380" height="80" rx="12" fill="#f4f8fb" stroke="#188aac" stroke-width="2"/>
  <text x="80" y="228" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">3. Answer-ready content</text>
  <text x="80" y="248" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Is the key claim extractable in 1-3 sentences?</text>
  <text x="80" y="266" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Test: direct answer near top, with a cited source</text>

  <!-- 4 -->
  <rect x="520" y="290" width="380" height="80" rx="12" fill="#f4f8fb" stroke="#197db4" stroke-width="2"/>
  <text x="540" y="318" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">4. Entity consistency</text>
  <text x="540" y="338" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Is the brand described the same way everywhere?</text>
  <text x="540" y="356" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Test: name, category, facts match owned + third-party</text>

  <!-- 5 -->
  <rect x="60" y="380" width="380" height="80" rx="12" fill="#f4f8fb" stroke="#10e66a" stroke-width="2"/>
  <text x="80" y="408" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">5. Third-party authority</text>
  <text x="80" y="428" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Do independent sources corroborate you?</text>
  <text x="80" y="446" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Test: relevant mentions, reviews, coverage exist</text>

  <!-- 6 -->
  <rect x="520" y="470" width="380" height="80" rx="12" fill="#f4f8fb" stroke="#0f172a" stroke-width="2"/>
  <text x="540" y="498" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#0f172a">6. Measurement</text>
  <text x="540" y="518" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Are we improving over time, under uncertainty?</text>
  <text x="540" y="536" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Test: repeated sampling with confidence bands</text>

  <!-- connectors -->
  <path d="M440,60 C480,60 480,150 518,150" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M700,190 C700,220 460,220 440,240" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M440,240 C480,240 480,330 518,330" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M700,370 C700,400 460,400 440,420" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
  <path d="M440,420 C480,420 480,510 518,510" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>

  <!-- feedback loop from measurement back to prompt demand -->
  <path d="M700,470 C700,20 700,0 250,0 C 120,0 100,10 100,18" stroke="#188aac" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow2)"/>
  <text x="480" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#188aac">Quarterly re-measurement loop: score each layer 0 (absent) to 3 (systematic)</text>
</svg>
